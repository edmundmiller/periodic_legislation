name: Run Summaries

on:
  # schedule:
  #   - cron: "0 0 1 * *" # Runs once a month
  workflow_dispatch:

# Manual / occasional only. Do not auto-commit generated vibes to main
# (that was the same contribution-graph noise as the daily pipeline).
# The CSV is uploaded as a workflow artifact; open a PR if you want it
# persisted in the repo for later site builds.
permissions:
  contents: read

jobs:
  run-summaries:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Run summaries script
        env:
          LEGISCAN_APIKEY: ${{ secrets.LEGISCAN_APIKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./pipeline/summarize_legislation.py

      - name: Upload generated summaries
        uses: actions/upload-artifact@v4
        with:
          name: state-period-care-vibes
          path: sources/generated/state_period_care_vibes.csv
          if-no-files-found: error
